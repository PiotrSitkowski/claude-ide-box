<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="520" viewBox="0 0 1110 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">claude-box architecture</title>
<desc id="desc">The IDE extension starts claude-box-exec on the host, which runs claude inside a project container via docker exec. The container sits on an internal Docker network with no route and no DNS; its only way out is a squid proxy that allows CONNECT to port 443 of allowlisted domains.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
</defs>
<rect width="1110" height="520" rx="14" fill="#ffffff"/>

<rect x="20" y="20" width="270" height="480" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="50" font-size="13" font-weight="600" letter-spacing="1.2" fill="#59636e">HOST</text>
<rect x="40" y="68" width="230" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="56" y="92" font-size="14" font-weight="600" fill="#1f2328">IDE</text>
<text x="56" y="112" font-size="12" fill="#59636e">Antigravity · VS Code · Cursor</text>
<line x1="155" y1="126" x2="155" y2="146" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="148" width="230" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="56" y="172" font-size="14" font-weight="600" fill="#1f2328">Claude Code extension</text>
<text x="56" y="192" font-size="12" fill="#59636e">claudeProcessWrapper</text>
<line x1="155" y1="206" x2="155" y2="226" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="228" width="230" height="74" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="56" y="252" font-size="14" font-weight="600" fill="#0f766e">claude-box-exec</text>
<text x="56" y="272" font-size="12" fill="#59636e">stdout = container stdout only</text>
<text x="56" y="289" font-size="12" fill="#59636e">fails closed · runs only docker</text>
<rect x="40" y="324" width="230" height="40" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="56" y="349" font-size="12" fill="#59636e">guard: bundled binary → wrapper</text>
<text x="40" y="400" font-size="12" font-weight="600" fill="#59636e">Never mounted</text>
<text x="40" y="420" font-size="12" fill="#59636e">~/.ssh · ~/.aws · ~/.gitconfig</text>
<text x="40" y="438" font-size="12" fill="#59636e">home directory · docker.sock</text>
<text x="40" y="456" font-size="12" fill="#59636e">IDE IPC sockets · other projects</text>
<text x="40" y="474" font-size="12" fill="#59636e">claude-box config and token file</text>

<rect x="370" y="20" width="500" height="480" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="390" y="50" font-size="13" font-weight="600" letter-spacing="1.2" fill="#59636e">DOCKER</text>

<rect x="388" y="66" width="272" height="414" rx="10" fill="#eef2f6" stroke="#d0d7de" stroke-dasharray="6 4"/>
<text x="404" y="90" font-size="12" font-weight="600" fill="#1f2328">claude-box-internal</text>
<text x="404" y="107" font-size="11" fill="#59636e">internal · no route · no DNS</text>

<rect x="404" y="122" width="240" height="250" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="420" y="146" font-size="14" font-weight="600" fill="#1f2328">project container</text>
<text x="420" y="164" font-size="12" fill="#59636e">claude (pinned) · non-root</text>
<line x1="420" y1="176" x2="628" y2="176" stroke="#d0d7de"/>
<text x="420" y="196" font-size="12" fill="#1f2328">/same/project/path</text><text x="628" y="196" font-size="11" text-anchor="end" fill="#0f766e">rw</text>
<text x="420" y="216" font-size="12" fill="#1f2328">.git .vscode .idea …</text><text x="628" y="216" font-size="11" text-anchor="end" fill="#59636e">ro</text>
<text x="420" y="236" font-size="12" fill="#1f2328">.env .env.* presets</text><text x="628" y="236" font-size="11" text-anchor="end" fill="#b42318">masked</text>
<text x="420" y="256" font-size="12" fill="#1f2328">/home/claude</text><text x="628" y="256" font-size="11" text-anchor="end" fill="#59636e">volume</text>
<line x1="420" y1="268" x2="628" y2="268" stroke="#d0d7de"/>
<text x="420" y="288" font-size="11" fill="#59636e">cap-drop ALL · no-new-privileges</text>
<text x="420" y="305" font-size="11" fill="#59636e">read-only rootfs · tmpfs /tmp</text>
<text x="420" y="322" font-size="11" fill="#59636e">pids, memory, CPU limits · --init</text>
<text x="420" y="339" font-size="11" fill="#59636e">one container + volume per project</text>
<text x="420" y="358" font-size="11" fill="#59636e">HTTPS_PROXY = proxy IP</text>

<rect x="404" y="392" width="240" height="72" rx="8" fill="#fdecea" stroke="#b42318" stroke-opacity="0.5"/>
<text x="420" y="413" font-size="11" font-weight="600" fill="#b42318">blocked</text>
<text x="420" y="431" font-size="11" fill="#1f2328">✕ DNS  ✕ direct egress  ✕ host</text>
<text x="420" y="450" font-size="11" fill="#1f2328">✕ other domains  ✕ HTTP  ✕ raw IPs</text>

<rect x="672" y="66" width="180" height="414" rx="10" fill="#eef2f6" stroke="#d0d7de" stroke-dasharray="6 4"/>
<text x="688" y="90" font-size="12" font-weight="600" fill="#1f2328">claude-box-egress</text>
<text x="688" y="107" font-size="11" fill="#59636e">ordinary bridge</text>

<rect x="684" y="186" width="156" height="118" rx="8" fill="#eef0fb" stroke="#4338ca" stroke-width="1.5"/>
<text x="698" y="210" font-size="14" font-weight="600" fill="#4338ca">squid proxy</text>
<text x="698" y="230" font-size="12" fill="#59636e">CONNECT :443 only</text>
<text x="698" y="248" font-size="12" fill="#59636e">domain allowlist</text>
<text x="698" y="266" font-size="12" fill="#59636e">no cache · logged</text>
<text x="698" y="284" font-size="12" fill="#59636e">non-root · read-only</text>
<line x1="646" y1="245" x2="682" y2="245" stroke="#4338ca" stroke-width="2" marker-end="url(#arrowP)"/>
<line x1="842" y1="245" x2="898" y2="245" stroke="#4338ca" stroke-width="2" marker-end="url(#arrowP)"/>

<rect x="900" y="166" width="190" height="158" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="916" y="190" font-size="13" font-weight="600" letter-spacing="1.2" fill="#59636e">INTERNET</text>
<text x="916" y="214" font-size="12" fill="#0f766e">api.anthropic.com</text>
<text x="916" y="232" font-size="12" fill="#0f766e">claude.ai · claude.com</text>
<text x="916" y="250" font-size="12" fill="#0f766e">platform.claude.com</text>
<text x="916" y="268" font-size="12" fill="#0f766e">registry.npmjs.org</text>
<line x1="916" y1="282" x2="1074" y2="282" stroke="#d0d7de"/>
<text x="916" y="302" font-size="11" fill="#59636e">+ presets · claude-box allow</text>
<line x1="272" y1="265" x2="402" y2="265" stroke="#0f766e" stroke-width="2" marker-start="url(#arrowA)" marker-end="url(#arrowA)"/>
<text x="330" y="252" font-size="11" text-anchor="middle" fill="#0f766e">docker exec -i</text>
<text x="330" y="283" font-size="11" text-anchor="middle" fill="#59636e">stdin / stdout</text>
</svg>
