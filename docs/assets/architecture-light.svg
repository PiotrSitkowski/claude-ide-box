<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="540" viewBox="0 0 1110 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">pii-airgap architecture</title>
<desc id="desc">On the host, the pii-airgap wrapper starts throw-away containers with no network: one scans the project read-only and reports which files hold personal data, without the values; another replaces the values in the try copy with tokens and later puts them back, using a token map that stays on the host. The AI agent in Claude IDE Box works on the copy and sees only tokens.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="1110" height="540" rx="14" fill="#ffffff"/>
<rect x="20" y="20" width="300" height="500" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="50" font-size="13" font-weight="600" letter-spacing="1.2" fill="#59636e">HOST</text>
<rect x="40" y="68" width="260" height="74" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="56" y="92" font-size="14" font-weight="600" fill="#1f2328">Your project</text>
<text x="56" y="112" font-size="12" fill="#59636e">real names, IBANs, PESELs ...</text>
<text x="56" y="129" font-size="12" fill="#59636e">never written by a scan</text>
<rect x="40" y="172" width="260" height="92" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="56" y="196" font-size="14" font-weight="600" fill="#0f766e">pii-airgap</text>
<text x="56" y="216" font-size="12" fill="#59636e">paths, checks and mounts only</text>
<text x="56" y="233" font-size="12" fill="#59636e">never reads file contents</text>
<text x="56" y="250" font-size="12" fill="#59636e">fails closed</text>
<line x1="170" y1="142" x2="170" y2="170" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="294" width="260" height="74" rx="8" fill="#eef0fb" stroke="#4338ca" stroke-width="1.5"/>
<text x="56" y="318" font-size="14" font-weight="600" fill="#4338ca">Token map</text>
<text x="56" y="338" font-size="12" fill="#59636e">~/.local/state/pii-airgap</text>
<text x="56" y="355" font-size="12" fill="#59636e">mode 600, host only</text>
<rect x="40" y="388" width="260" height="56" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
<text x="56" y="412" font-size="14" font-weight="600" fill="#1f2328">Your lists</text>
<text x="56" y="432" font-size="12" fill="#59636e">~/.config/pii-airgap/lists</text>
<text x="40" y="474" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Never in a container the agent can see:</text>
<text x="40" y="494" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">the token map · your lists · the scan cache</text>
<rect x="360" y="20" width="380" height="500" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="380" y="50" font-size="13" font-weight="600" letter-spacing="1.2" fill="#59636e">THROW-AWAY CONTAINERS</text>
<rect x="378" y="62" width="344" height="24" rx="6" fill="#fdecea" stroke="#b42318"/>
<text x="550" y="79" font-size="12" font-weight="600" fill="#b42318" text-anchor="middle">--network none · read-only · no capabilities · your UID</text>
<rect x="378" y="100" width="344" height="186" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="394" y="124" font-size="14" font-weight="600" fill="#1f2328">scan</text>
<text x="394" y="144" font-size="12" fill="#59636e">project mounted read-only, no token map</text>
<text x="394" y="161" font-size="12" fill="#59636e">text: DOCX · XLSX · PDF · OCR · LibreOffice</text>
<text x="394" y="178" font-size="12" fill="#59636e"></text>
<text x="394" y="195" font-size="12" fill="#59636e">1  checksums: IBAN, cards, PESEL, NIP, ...</text>
<text x="394" y="212" font-size="12" fill="#59636e">2  patterns with context words</text>
<text x="394" y="229" font-size="12" fill="#59636e">3  your lists</text>
<text x="394" y="246" font-size="12" fill="#59636e">4  local NER model, baked into the image</text>
<text x="394" y="270" font-size="12" font-weight="600" fill="#0f766e" text-anchor="start">report: types, lines, confidence - no values</text>
<rect x="378" y="304" width="344" height="130" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="394" y="328" font-size="14" font-weight="600" fill="#1f2328">pseudonymise · restore</text>
<text x="394" y="348" font-size="12" fill="#59636e">plain UTF-8 text only, no document parsers</text>
<text x="394" y="365" font-size="12" fill="#59636e">Jan Kowalski  →  [PERSON_1]</text>
<text x="394" y="382" font-size="12" fill="#59636e">restore: exact known tokens only;</text>
<text x="394" y="399" font-size="12" fill="#59636e">unknown or altered ones stop it</text>
<text x="394" y="466" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Nothing can be downloaded or sent:</text>
<text x="394" y="486" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">the model is part of the image.</text>
<line x1="300" y1="210" x2="376" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowA)"/>
<line x1="300" y1="330" x2="376" y2="360" stroke="#4338ca" stroke-width="2" marker-start="url(#arrowP)" marker-end="url(#arrowP)"/>
<rect x="780" y="20" width="310" height="500" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="800" y="50" font-size="13" font-weight="600" letter-spacing="1.2" fill="#59636e">CLAUDE IDE BOX (optional)</text>
<rect x="798" y="84" width="274" height="92" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="814" y="108" font-size="14" font-weight="600" fill="#1f2328">try copy</text>
<text x="814" y="128" font-size="12" fill="#59636e">[PERSON_1], [IBAN_1], [PESEL_1]</text>
<text x="814" y="145" font-size="12" fill="#59636e">documents with PII masked</text>
<text x="814" y="162" font-size="12" fill="#59636e">.git removed</text>
<line x1="722" y1="370" x2="796" y2="140" stroke="#4338ca" stroke-width="2" marker-end="url(#arrowP)"/>
<line x1="935" y1="176" x2="935" y2="214" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="216" width="274" height="92" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="814" y="240" font-size="14" font-weight="600" fill="#1f2328">Claude Code container</text>
<text x="814" y="260" font-size="12" fill="#59636e">sees tokens, not values</text>
<text x="814" y="277" font-size="12" fill="#59636e">told to keep tokens intact</text>
<line x1="935" y1="308" x2="935" y2="346" stroke="#b42318" stroke-width="2" marker-end="url(#arrowR)"/>
<rect x="798" y="348" width="274" height="74" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
<text x="814" y="372" font-size="14" font-weight="600" fill="#b42318">AI provider</text>
<text x="814" y="392" font-size="12" fill="#59636e">receives tokens - and anything</text>
<text x="814" y="409" font-size="12" fill="#59636e">the detectors missed</text>
<text x="798" y="456" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">try apply: values restored on the host,</text>
<text x="798" y="476" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">then the changes reach your files</text>
</svg>
