name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x bin/claude-ide-box bin/claude-ide-box-exec install.sh \
            lib/claude-ide-box/*.sh image/create-user.sh proxy/entrypoint.sh \
            tests/*.sh tests/unit/*.sh tests/unit/fake-bin/docker tests/integration/*.sh

  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, GNU bash
            os: ubuntu-latest
          - name: macOS, /bin/bash 3.2 + BSD userland
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the system bash 3.2 on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          bash --version | head -n 1
          if [ "$RUNNER_OS" = macOS ]; then bash --version | head -n 1 | grep -q 'version 3\.2' ; fi
      - name: Unit tests
        run: bash tests/run-unit.sh

  unit-bash32-busybox:
    name: unit (bash 3.2, busybox userland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests in the official bash:3.2 image
        run: |
          docker run --rm -v "$PWD":/src:ro bash:3.2 \
            bash -c 'cp -r /src /w && cd /w && TMPDIR=/tmp bash tests/run-unit.sh'

  integration:
    name: integration (real Docker, Debian images)
    runs-on: ubuntu-latest
    needs: [shellcheck, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        env:
          CLAUDE_IDE_BOX_REQUIRE_DOCKER: "1"
          CLAUDE_IDE_BOX_IT_PROFILES: php python go rust java office
        run: bash tests/integration/run.sh
